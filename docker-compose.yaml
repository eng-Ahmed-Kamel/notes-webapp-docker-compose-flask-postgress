services:

  db:
    image: postgres:15
    container_name: notes-db
    restart: always
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespwd
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: notes-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASS: notespwd
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: notes-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
